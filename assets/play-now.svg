<svg xmlns="http://www.w3.org/2000/svg" width="280" height="72" viewBox="0 0 280 72" role="img" aria-label="Play Now">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2975"/>
      <stop offset="0.5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2975"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0033"/>
      <stop offset="1" stop-color="#0d0025"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- button body -->
  <rect x="4" y="4" width="272" height="64" rx="14" fill="url(#fill)" stroke="url(#border)" stroke-width="3" filter="url(#glow)"/>
  <!-- inner accent line -->
  <rect x="11" y="11" width="258" height="50" rx="9" fill="none" stroke="#ff2975" stroke-opacity="0.35" stroke-width="1"/>
  <!-- label -->
  <text x="140" y="46" font-family="'Courier New', monospace" font-size="26" font-weight="bold" text-anchor="middle" fill="#00f0ff" letter-spacing="5" filter="url(#glow)">&#9654; PLAY NOW</text>
</svg>